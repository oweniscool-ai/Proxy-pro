<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitCom - Clean GitHub Pages to .com Converter</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        code, pre {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-emerald-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-globe text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg tracking-tight flex items-center gap-1.5">
                        GitCom <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full font-semibold">.com wizard</span>
                    </h1>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a href="#guide" class="text-xs font-semibold text-slate-400 hover:text-white transition hidden sm:inline-block">Setup Guide</a>
                <button onclick="scrollToGenerator()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-4 py-2 rounded-xl transition shadow-lg shadow-emerald-600/20">
                    Get Started
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="pt-12 pb-8 px-4 text-center max-w-4xl mx-auto">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900 border border-slate-800 text-xs font-medium text-emerald-400 mb-6">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Transform username.github.io into yourdomain.com
        </div>
        <h2 class="text-4xl sm:text-5xl font-extrabold tracking-tight mb-4 text-white">
            Give your GitHub project a <span class="bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">professional .com</span>
        </h2>
        <p class="text-base sm:text-lg text-slate-400 max-w-2xl mx-auto">
            Generate exact DNS records, build your <code class="text-emerald-400 bg-slate-900 px-1.5 py-0.5 rounded text-sm">CNAME</code> file, and link your custom domain to GitHub Pages in minutes.
        </p>
    </section>

    <!-- Main Generator Card -->
    <main class="max-w-3xl mx-auto px-4 w-full pb-16 flex-grow" id="generator">
        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl">
            
            <!-- Step 1: Inputs -->
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">1. Your GitHub Username or Org</label>
                    <div
